server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Hashed build files and images never change -> cache for a year.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /__l5e/  { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

    # Every page is a prerendered file: /impressum -> /impressum/index.html.
    # Unknown URLs get the real 404 status (no SPA fallback needed).
    location / {
        try_files $uri $uri/index.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /index.html;
}
